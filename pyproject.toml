[project]
name = "sandbox"
version = "0.1.0"
description = "Just for learning."
readme = "README.md"
authors = [
    { name = "lazy-skunk", email = "65598223+lazy-skunk@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "a2wsgi>=1.10.10,<2",
    "apache-airflow>=3.4.0",
    "dotenv>=0.9.9",
    "fastapi>=0.165.0",
    "flask>=3.1,<4",
    "httpx>=0.28,<1",
    "locust>=2.47.0",
    "marimo>=0.25.2,<1",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0,<3",
    "networkx>=3.6.1",
    "numpy>=2.5.5",
    "polars>=2.1.0,<3",
    "psycopg2-binary>=2.9.12",
    "pulp[cbc]>=4.2.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "scikit-learn>=1.9.1",
    "sqlglot>=30.31.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    "NPY",
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.pytest.ini_options]
strict = true
addopts = "--cov=playground --cov-config=.coveragerc --cov-branch --cov-report=html"
testpaths = ["tests"]
