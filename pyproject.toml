[project]
name = "sandbox"
version = "0.1.0"
description = "Just for learning."
readme = "README.md"
authors = [
    { name = "lazy-skunk", email = "65598223+lazy-skunk@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "apache-airflow==2.10.3",
    "dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mypy>=2.3.0",
    "nbconvert>=7.17.1",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pre-commit>=4.7.0",
    "psycopg2-binary>=2.9.12",
    "pulp[cbc]>=4.2.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "sqlglot>=30.16.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
target-version = "py313"
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    "PD",
    "NPY",
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "--cov=playground --cov-config=.coveragerc --cov-report=html"
testpaths = ["tests"]
