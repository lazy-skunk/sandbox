name: Lint

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync --locked

      - name: Format check with Ruff
        run: uv run --frozen --no-sync ruff format --check --output-format=github .

      - name: Lint check with Ruff
        run: uv run --frozen --no-sync ruff check --output-format=github .

      - name: Type check with ty
        run: uv run --frozen --no-sync ty check --output-format=github .

      - name: Check marimo notebooks
        run: uv run --frozen --no-sync marimo check --ignore-scripts .
